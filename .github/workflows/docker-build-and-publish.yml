---
name: Create and publish a Docker image for every release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_GALAXY: fortytwoservices/swaggerimporter

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Extract metadata (tags, labels) for container
      # if the event that triggered the workflow is a release
      - name: Release Galaxy, Extract metadata (tags, labels)
        id: meta_release_galaxy
        if: github.event_name == 'release'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GALAXY }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # Build and push the Docker image
      # if the event that triggered the workflow is a release
      - name: Release Galaxy, Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: github.event_name == 'release'
        with:
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta_release_galaxy.outputs.tags }}
          labels: ${{ steps.meta_release_galaxy.outputs.labels }}
          annotations: ${{ steps.meta_release_galaxy.outputs.annotations }}
          outputs: type=image,oci-mediatypes=true
